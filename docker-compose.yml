# API + Mongo + Redis. Frontend: `cd frontend && npm run dev`, or `docker compose --profile frontend up frontend` (Stockfish 18 in API image).
version: "3.9"

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - MONGODB_DB_NAME=chess_eval
      - STOCKFISH_PATH=/usr/local/bin/stockfish
      - STOCKFISH_DEPTH=20
      - STOCKFISH_MOVETIME=1000
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:4173"]
    depends_on:
      - mongodb
      - redis
    restart: unless-stopped

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8888
    ports:
      - "4173:4173"
    depends_on:
      - api
    restart: unless-stopped

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
  redis_data:
